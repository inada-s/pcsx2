name: zdxsv release

# Push a tag zdxsv-X.Y.Z -> Windows build -> GitHub release with
# pcsx2-zdxsv-windows-x64.7z (auto updater) and .zip (first install).
# A tag with a suffix (zdxsv-0.0.1-rc1) becomes a prerelease, which the updater skips.
on:
  push:
    tags:
      - "zdxsv-*"

permissions:
  contents: write

jobs:
  vars:
    name: "Check repository variables"
    runs-on: ubuntu-latest
    steps:
      - name: Production server variables are set
        env:
          ZDXSV_SERVER_HOST: ${{ vars.ZDXSV_SERVER_HOST }}
          ZDXSV_UDPTEST_URL: ${{ vars.ZDXSV_UDPTEST_URL }}
        run: |
          ok=1
          for v in ZDXSV_SERVER_HOST ZDXSV_UDPTEST_URL; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is empty"; ok=0; fi
          done
          [ "$ok" = 1 ]

  build:
    name: "Windows"
    needs: vars
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake Clang"
      artifactPrefixName: "PCSX2-windows-Qt-x64-cmake-clang"
      configuration: CMake
      buildSystem: cmake
      # The production servers: only this build has them as defaults (a build from source has none).
      cmakeFlags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl "-DZDXSV_SERVER_HOST=${{ vars.ZDXSV_SERVER_HOST }}" "-DZDXSV_UDPTEST_URL=${{ vars.ZDXSV_UDPTEST_URL }}"
      fetchTags: true

  release:
    name: "Release"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zdxsv-release-windows-x64
          path: zdxsv-release

      - name: Check the production server defaults
        env:
          ZDXSV_SERVER_HOST: ${{ vars.ZDXSV_SERVER_HOST }}
          ZDXSV_UDPTEST_URL: ${{ vars.ZDXSV_UDPTEST_URL }}
        run: |
          unzip -q zdxsv-release/pcsx2-zdxsv-windows-x64.zip -d check
          grep -aqF "$ZDXSV_SERVER_HOST" check/pcsx2-qt*.exe
          grep -aqF "$ZDXSV_UDPTEST_URL" check/pcsx2-qt*.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          if ! [[ "$TAG" =~ ^zdxsv-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then PRE="--prerelease"; fi
          gh release create "$TAG" zdxsv-release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $PRE

  sentry:
    name: "Sentry debug files"
    needs: build
    runs-on: ubuntu-latest
    env:
      SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Check the Sentry settings
        id: cfg
        run: |
          if [ -n "$SENTRY_TOKEN" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "upload=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SENTRY_TOKEN or SENTRY_PROJECT is not set: no debug files uploaded"
          fi

      - uses: actions/download-artifact@v8
        if: steps.cfg.outputs.upload
        with:
          pattern: "*-symbols"
          path: debug-files
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: steps.cfg.outputs.upload
        with:
          name: zdxsv-release-windows-x64
          path: zdxsv-release

      - name: Setup Sentry CLI
        if: steps.cfg.outputs.upload
        uses: mathieu-bour/setup-sentry-cli@v2
        with:
          url: https://sentry.io
          token: ${{ env.SENTRY_TOKEN }}
          organization: gdxsv-project
          project: ${{ env.SENTRY_PROJECT }}
          version: 2.21.2

      - name: Upload debug files
        if: steps.cfg.outputs.upload
        run: |
          unzip -q zdxsv-release/pcsx2-zdxsv-windows-x64.zip -d debug-files/bin
          sentry-cli debug-files upload --type pe --type pdb --wait debug-files
