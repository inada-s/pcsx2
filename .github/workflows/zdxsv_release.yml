name: zdxsv release

# Push a tag zdxsv-X.Y.Z -> Windows build -> GitHub release with
# pcsx2-zdxsv-windows-x64.7z (auto updater) and .zip (first install).
# A tag with a suffix (zdxsv-0.0.1-rc1) becomes a prerelease, which the updater skips.
on:
  push:
    tags:
      - "zdxsv-*"

permissions:
  contents: write

jobs:
  vars:
    name: "Check repository variables"
    runs-on: ubuntu-latest
    steps:
      - name: Production server variables are set
        env:
          ZDXSV_SERVER_HOST: ${{ vars.ZDXSV_SERVER_HOST }}
          ZDXSV_UDPTEST_URL: ${{ vars.ZDXSV_UDPTEST_URL }}
        run: |
          ok=1
          for v in ZDXSV_SERVER_HOST ZDXSV_UDPTEST_URL; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is empty"; ok=0; fi
          done
          [ "$ok" = 1 ]

      - name: Crash report variables are set
        env:
          ZDXSV_SENTRY_DSN: ${{ vars.ZDXSV_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$ZDXSV_SENTRY_DSN" ]; then echo "::warning::Repository variable ZDXSV_SENTRY_DSN is empty: this release sends no crash reports"; fi
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "::warning::Secret SENTRY_AUTH_TOKEN is empty: crash reports of this release have no symbols"; fi

  build:
    name: "Windows"
    needs: vars
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake Clang"
      artifactPrefixName: "PCSX2-windows-Qt-x64-cmake-clang"
      configuration: CMake
      buildSystem: cmake
      # The production servers: only this build has them as defaults (a build from source has none).
      cmakeFlags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl "-DZDXSV_SERVER_HOST=${{ vars.ZDXSV_SERVER_HOST }}" "-DZDXSV_UDPTEST_URL=${{ vars.ZDXSV_UDPTEST_URL }}" "-DZDXSV_SENTRY_DSN=${{ vars.ZDXSV_SENTRY_DSN }}"
      fetchTags: true

  symbols:
    name: "Upload crash report symbols"
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        if: env.SENTRY_AUTH_TOKEN != ''
        with:
          name: zdxsv-release-windows-x64
          path: zdxsv-release

      - uses: actions/download-artifact@v8
        if: env.SENTRY_AUTH_TOKEN != ''
        with:
          pattern: "*-symbols"
          merge-multiple: true
          path: symbols

      - name: Upload binaries and PDBs
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_ORG: gdxsv-project
          SENTRY_PROJECT: pcsx2-zdxsv
        run: |
          unzip -q zdxsv-release/pcsx2-zdxsv-windows-x64.zip -d binaries
          npx --yes @sentry/cli@2 debug-files upload --type pe --type pdb --wait binaries symbols

  release:
    name: "Release"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zdxsv-release-windows-x64
          path: zdxsv-release

      - name: Check the production server defaults
        env:
          ZDXSV_SERVER_HOST: ${{ vars.ZDXSV_SERVER_HOST }}
          ZDXSV_UDPTEST_URL: ${{ vars.ZDXSV_UDPTEST_URL }}
        run: |
          unzip -q zdxsv-release/pcsx2-zdxsv-windows-x64.zip -d check
          grep -aqF "$ZDXSV_SERVER_HOST" check/pcsx2-qt*.exe
          grep -aqF "$ZDXSV_UDPTEST_URL" check/pcsx2-qt*.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release made by hand for this tag (e.g. on the web, which also creates the tag) is kept:
          # only the build's files are attached to it, replacing any with the same name.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" zdxsv-release/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          PRE=""
          if ! [[ "$TAG" =~ ^zdxsv-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then PRE="--prerelease"; fi
          gh release create "$TAG" zdxsv-release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $PRE
