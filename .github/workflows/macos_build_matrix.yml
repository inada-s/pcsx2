name: 🍎 MacOS Builds

# zdxsv fork: Windows-only CI for now (macOS returns with M8). Run by hand when needed.
on:
  workflow_dispatch:

jobs:
  build_macos_qt:
    name: "Defaults"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/macos_build.yml
    with:
      jobName: "MacOS Build"
      artifactPrefixName: "PCSX2-macos-Qt"
      sign_and_notarize: true # If we find that notarization takes a long time we should disable that on PR builds
    secrets: inherit
  build_macos_qt_arm:
    name: "arm64"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/macos_build.yml
    with:
      jobName: "MacOS arm64 Build"
      artifactPrefixName: "PCSX2-macos-Qt-arm64"
      arch: arm64
    secrets: inherit
