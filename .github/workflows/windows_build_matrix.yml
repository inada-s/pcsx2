name: 🖥️ Windows Builds

# zdxsv fork: one Windows build only, the configuration upstream releases with
# (release_cut_new.yml: CMake + clang-cl). The other upstream variants (MSVC/clang
# SSE4/AVX2 msbuild, CMake MSVC) are dropped to keep CI short.

on:
  push:
    branches-ignore:
      - "l10n_master"
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_qt_cmake_clang:
    name: "CMake"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake Clang"
      artifactPrefixName: "PCSX2-windows-Qt-x64-cmake-clang"
      configuration: CMake
      buildSystem: cmake
      cmakeFlags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
    secrets: inherit
