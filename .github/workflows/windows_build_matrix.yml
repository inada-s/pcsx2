name: 🖥️ Windows Builds

# zdxsv fork: one Windows build only, the configuration upstream releases with
# (release_cut_new.yml: CMake + clang-cl). The other upstream variants (MSVC/clang
# SSE4/AVX2 msbuild, CMake MSVC) are dropped to keep CI short.
# Runs on pushes to zdxsv-master / ai/zdxsv and on PRs into any branch, so a
# stacked PR is built too and its check stays on the commit when it is retargeted.
# A draft PR is not built: the build starts when the PR is marked ready for review.
# No secrets: none are used.

on:
  push:
    branches:
      - "zdxsv-master"
      - "ai/zdxsv"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build_qt_cmake_clang:
    name: "CMake"
    if: (github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request') && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake Clang"
      artifactPrefixName: "PCSX2-windows-Qt-x64-cmake-clang"
      configuration: CMake
      buildSystem: cmake
      cmakeFlags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
