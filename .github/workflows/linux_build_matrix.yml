name: 🐧 Linux Builds

# zdxsv fork: Windows-only CI for now (macOS returns with M8). Run by hand when needed.
on:
  workflow_dispatch:

jobs:
  build_linux_qt:
    name: "AppImage"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "AppImage Build"
      artifactPrefixName: "PCSX2-linux-Qt-x64-appimage"
      compiler: clang
      cmakeflags: ""
      buildAppImage: true
    secrets: inherit
  build_linux_debug:
    name: "Debug"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "Debug Build"
      artifactPrefixName: "PCSX2-linux-Qt-x64-debug"
      compiler: clang
      cmakeflags: ""
      buildAppImage: true
      cmakeBuildType: Debug
    secrets: inherit
  build_linux_flatpak:
    name: "Flatpak"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/linux_build_flatpak.yml
    with:
      jobName: "Flatpak Build"
      artifactPrefixName: "PCSX2-linux-Qt-x64-flatpak"
      compiler: clang
      cmakeflags: ""
      publish: false
    secrets: inherit
