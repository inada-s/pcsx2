// zdxsv replay file (<battle_code>.pb): gdxsv's BattleLogFile (inada-s/gdxsv gdxsv/proto/gdxsv.proto) with the
// same field numbers, plus the fields a PCSX2 replay needs from 40 on. Written by ReplayWrite, read by PlayLoadFile
// (pcsx2/Zdxsv/Ggpo.cpp) with the codec in Zdxsv/Proto.h; not compiled into PCSX2.
//
// Both start from a common post-entry save state (gdxsv: flycast slot 99, one per disc; here ZdxsvReplayStateUrl) and
// play the battle start from the recorded lobby answers. One file holds every position's inputs: the player picks the
// point of view before the start, and the lobby answers name it as the own position.
syntax = "proto3";

package zdxsv;

message BattleLogUser {
  string user_id = 1;
  string user_name = 2;
  int32 pos = 12;  // battle position (0-based)
}

message BattleLogFile {
  string game_disk = 5;  // "zdxsv-ps2"
  string battle_code = 3;
  int32 log_file_version = 4;
  repeated BattleLogUser users = 11;  // by position

  int64 start_at = 20;  // unix seconds
  int64 end_at = 21;
  string close_reason = 24;

  // zdxsv (PCSX2)
  int32 players = 40;
  int32 position = 41;  // the recorder's battle position (its RNG A values below)
  int32 input_delay = 42;  // GGPO frames
  string battle_info = 43;  // the lobby's battle info, key=value lines ("" in a local test)
  // HLE state outside the save state at frame 0: the game's battle socket (Ggpo.cpp NetApply)
  bool zds_ps = 44;  // play-start msgs on
  bytes net_rx0 = 45;  // msgs waiting for the game's recv
  repeated int32 hle0 = 46;  // play-start barrier n, rel, hold, go; kind-3 seen 0..3, rel
  int32 input_size = 47;  // bytes per player per frame (Ggpo.cpp NetInput)
  int32 frames = 48;  // GGPO-confirmed frames
  bytes inputs = 49;  // frames * players * input_size: frame-major, by position
  reserved 50;  // was start_state: a save state at GGPO frame 0 (older files, no longer played)
  // The lobby's battle-start answers 0x6911..0x6917 as the game got them (whole frames: 12-byte header + body).
  // The replay plays the start from them on any post-entry state, 0x6912 (own position) = the chosen point of view.
  repeated bytes lobby_answers = 51;
  // Optional desync checks (a file without them plays the same). Taken at each frame before its inputs apply.
  // u32 LE per frame: XXH3 of the 4 players' masked work + RNG B (Ggpo.cpp ReplayStateHash). Equal in the files of
  // all positions of one battle; a replay logs the frames where it differs.
  bytes state_hashes = 52;
  // The game RNGs, u16 RNG A (0x6d7940) << 16 | u16 RNG B (0x6d793c), at frame 0 and at each battle load end
  // (the tick state 0xc627b4 leaves 8: load 0 = MS select, 1 = briefing, 1 + N = round N start), for round skip.
  // RNG A takes machine-local draws: these values are the recorder's position's.
  optional uint32 start_rng = 53;
  repeated int32 load_frames = 54;
  repeated uint32 load_rngs = 55;
  // The frames where the tick state enters 8: the battle load step passed and initialized the per-battle player
  // work. Without zds_ps this pass is local load timing; a replay holds the step to these frames (else player work
  // and RNG B can start a frame apart from the recording). Optional: a file without them plays at local timing.
  repeated int32 load_start_frames = 56;
}
