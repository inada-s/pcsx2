// zdxsv replay file (<battle_code>.pb): gdxsv's BattleLogFile with the same field numbers, plus the PCSX2 fields
// from 40 on. Written by ReplayWrite, read by PlayLoadFile with the codec in Proto.h; not compiled into PCSX2.
syntax = "proto3";

package zdxsv;

message BattleLogUser {
  string user_id = 1;
  string user_name = 2;
  string pilot_name = 3;  // lobby battle info pilot_<user>= ("" if none)
  int32 pos = 12;  // battle position (0-based)
}

// gdxsv BattleLogRound: one per round, in order.
message BattleLogRound {
  int32 win_team = 1;  // 1 or 2 (team 1 = position 0's side); -1 = draw (time-up: both teams take a loss)
  repeated int32 used_ms = 2;  // by position: the MS id at the round end + 1 (player work +0x1f2a; 1 = Gundam)
}

message BattleLogFile {
  string game_disk = 5;  // "zdxsv-ps2"
  string battle_code = 3;
  int32 log_file_version = 4;
  repeated BattleLogUser users = 11;  // by position

  int64 start_at = 20;  // unix seconds
  int64 end_at = 21;
  string close_reason = 24;
  repeated BattleLogRound round_data = 18;  // from the team result records (0xc227f0, 0xc22804)

  // zdxsv (PCSX2)
  int32 players = 40;
  int32 position = 41;  // the recorder's battle position (its RNG A values below)
  int32 input_delay = 42;  // GGPO frames
  string battle_info = 43;  // the lobby's battle info, key=value lines ("" in a local test)
  // battle socket emulation state at frame 0
  reserved 44;  // was zds_ps
  bytes net_rx0 = 45;  // msgs waiting for the game's recv
  repeated int32 hle0 = 46;  // play-start barrier n, rel, hold, go; kind-3 seen 0..3, rel; MS-select barrier n, rel, hold, go (absent: played without it)
  int32 input_size = 47;  // bytes per player per frame (NetInput)
  int32 frames = 48;  // GGPO-confirmed frames
  bytes inputs = 49;  // frames * players * input_size: frame-major, by position
  reserved 50;  // was start_state
  // The lobby's battle-start answers 0x6911..0x6917 as the game got them (whole frames: 12-byte header + body).
  // The replay plays the start from them on any post-entry state, 0x6912 (own position) = the chosen point of view.
  repeated bytes lobby_answers = 51;
  // Optional desync checks (a file without them plays the same). Taken at each frame before its inputs apply.
  // u32 LE per frame: ReplayStateHash (4 players' masked work + RNG B). Equal in every position's file of a battle.
  bytes state_hashes = 52;
  // The game RNGs, u16 RNG A (0x6d7940) << 16 | u16 RNG B (0x6d793c), at frame 0 and at each battle load end
  // (the tick state 0xc627b4 leaves 8: load 0 = MS select, 1 = briefing, 1 + N = round N start), for round skip.
  // RNG A takes machine-local draws: these values are the recorder's position's.
  optional uint32 start_rng = 53;
  repeated int32 load_frames = 54;
  repeated uint32 load_rngs = 55;
  reserved 56;  // was load_start_frames
  // The frames the play-start barrier passes (a game starts), and per game the last tick state 6 -> 7 before the next
  // play start (the game end). Peers enter the game end on different frames: state checks skip each game end to the
  // next play start.
  repeated int32 play_start_frames = 57;
  repeated int32 game_end_frames = 58;
  // Pairs: each earlier tick state 6 -> 7 after the same play start (a round end) and the frame the tick next enters 6.
  // The peers enter the round's load between them on different frames (RNG B is drawn there): state checks skip it.
  repeated int32 round_end_frames = 59;
}
